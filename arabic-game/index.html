<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<title>هيّا نلعب: الفقرة والجملة والكلمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: one white "board" card at a time on a calm sky page; chunky toy-like buttons, a tree mascot from the lesson, single bright theme on purpose. */
:root{
  color-scheme: light;
  --bg:#eef7f6; --card:#ffffff; --ink:#24324a; --muted:#66748a;
  --line:#dbeaec; --line-d:#bcd6d9;
  --teal:#178a9c; --teal-d:#0e6675; --teal-s:#d8f1f4;
  --pink:#d9508a; --pink-d:#a8346a; --pink-s:#fce4ef;
  --orange:#ef8a2b; --orange-d:#bd6414; --orange-s:#feebd8;
  --green:#25a064; --green-d:#177548; --green-s:#dbf5e7;
  --violet:#7a5bd5; --violet-d:#5a3db1; --violet-s:#ece6fc;
  --sun:#f3b51b; --sun-d:#a87a00; --sun-s:#fff4cf;
  --red:#e2533f; --red-d:#ad3826; --red-s:#fde4df;
  --leaf:#4db36f; --leaf-l:#7fd09a; --leaf-d:#2c8a4c; --trunk:#9c6b43; --apple:#e8443a;
  --ui:"Baloo Bhaijaan 2","Tahoma","Segoe UI",sans-serif;
  --txt:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--ui);background-color:var(--bg);
  background-image:radial-gradient(circle at 0 0,var(--pink-s) 0,transparent 28rem),radial-gradient(circle at 100% 100%,var(--teal-s) 0,transparent 32rem);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:20px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.press{box-shadow:0 6px 0 var(--sh,var(--line-d));transition:transform .1s,box-shadow .1s,background .2s,border-color .2s}
.press:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--sh,var(--line-d))}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.home{display:flex;align-items:center;gap:10px;background:var(--teal);color:#fff;border-radius:999px;padding-block:7px;padding-inline:7px 24px;font-weight:800;font-size:1.35rem;--sh:var(--teal-d)}
.home .ic{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--teal);display:grid;place-items:center}
.home svg{width:30px;height:30px}
.tools{display:flex;gap:10px}
.icon{width:60px;height:60px;border-radius:50%;background:var(--card);color:var(--teal);display:grid;place-items:center}
.icon svg{width:28px;height:28px}
.teams{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.team{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:999px;padding-block:4px;padding-inline:16px 8px;font-weight:800;font-size:1.2rem;transition:transform .2s}
.team .ti{font-size:1.4rem}
.team b{min-width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.6rem;font-variant-numeric:tabular-nums}
.team.t0 .ti{color:var(--pink)} .team.t0 b{background:var(--pink)}
.team.t1 .ti{color:var(--teal)} .team.t1 b{background:var(--teal)}
.team.active{transform:scale(1.07)}
.team.t0.active{border-color:var(--pink);background:var(--pink-s)}
.team.t1.active{border-color:var(--teal);background:var(--teal-s)}
.team b.bump{animation:pop .5s}

/* tree mascot */
.mascot{flex:none;transform-origin:50% 100%}
.mascot svg{display:block;width:100%;height:auto}
.mascot.happy{animation:hop .55s 2}
.mascot.sad{animation:sway .9s}
.t-lf{fill:var(--leaf)} .t-hl{fill:var(--leaf-l);opacity:.55} .t-tr{fill:var(--trunk)} .t-gr{fill:var(--line-d)}
.t-ap{fill:var(--apple)} .t-st{stroke:var(--leaf-d);stroke-width:3;fill:none;stroke-linecap:round}
.t-ln{stroke:var(--ink);stroke-width:5;fill:none;stroke-linecap:round} .t-eye{fill:var(--ink)} .t-ck{fill:var(--pink);opacity:.45}
.apl{transform-box:fill-box;transform-origin:center}
.apl.new{animation:grow .7s cubic-bezier(.3,1.7,.5,1)}

/* home */
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px;background:var(--card);border-radius:34px;padding:20px 28px;box-shadow:0 8px 0 var(--line)}
.hero .mascot{width:150px}
.bubble{position:relative;flex:1 1 380px;min-width:0;background:var(--sun-s);border-radius:28px;padding:16px 26px}
.bubble::before{content:"";position:absolute;inset-inline-start:-14px;top:42px;border:14px solid transparent;border-inline-end-color:var(--sun-s);border-inline-start:0}
.bubble h1{margin:0;font-size:clamp(2rem,4.6vw,3.3rem);line-height:1.15;color:var(--teal-d);text-wrap:balance}
.bubble p{margin:6px 0 0;font-family:var(--txt);font-size:clamp(1.1rem,1.9vw,1.4rem);line-height:1.9}
.switch{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:24px;padding:12px 18px;font-weight:800;font-size:1.25rem;cursor:pointer}
.switch input{width:32px;height:32px;accent-color:var(--pink);flex:none}
.switch small{display:block;font-weight:600;color:var(--muted);font-size:.95rem}
.sec{display:flex;flex-direction:column;gap:14px}
.sech{display:flex;align-items:center;gap:12px;margin:6px 0 0;font-size:clamp(1.3rem,2.4vw,1.75rem);color:var(--ink);text-wrap:balance}
.lnum{width:52px;height:46px;flex:none;display:grid;place-items:center;color:#fff;background:var(--c);font-size:1.5rem;border-radius:46% 54% 40% 60%/55% 45% 55% 45%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px}
.card{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:28px;padding:16px 18px;text-align:start;min-height:124px;--sh:var(--line-d)}
.card:hover{background:var(--cs)}
.gi{flex:none;width:84px;height:84px;border-radius:26px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:800;box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.gi svg{width:46px;height:46px}
.card h3{margin:0;font-size:1.55rem;line-height:1.25;color:var(--cd)}
.card p{margin:2px 0 0;color:var(--muted);font-size:1.05rem;line-height:1.5}
.cstars{display:block;margin-top:4px;font-size:1.25rem;letter-spacing:3px;color:var(--sun)}
.cstars .off{color:var(--line-d)}
.card.special{background:var(--sun-s);outline:3px solid var(--sun);outline-offset:-3px}
.learn{background:var(--card);border-radius:30px;padding:20px 24px;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;gap:14px}
.learn h2{margin:0;color:var(--pink-d);font-size:1.6rem}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.lv{flex:1 1 170px;border-radius:22px;padding:10px 14px;text-align:center;background:var(--cs);color:var(--cd);min-width:0}
.lv b{display:block;font-size:1.6rem}
.lv span{display:block;font-family:var(--txt);font-size:1.1rem;color:var(--ink);line-height:1.8}
.arr{font-weight:800;color:var(--muted);font-size:.95rem;text-align:center;line-height:1.2}
.learn ul{margin:0;padding-inline-start:24px;font-family:var(--txt);font-size:clamp(1.1rem,1.8vw,1.35rem);line-height:2}

/* stage */
.stage{background:var(--card);border-radius:34px;padding:clamp(18px,3vw,36px);display:flex;flex-direction:column;gap:22px;box-shadow:0 8px 0 var(--line);flex:1}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.shead .gi{width:58px;height:58px;border-radius:18px;font-size:1.3rem}
.shead .gi svg{width:32px;height:32px}
.gtitle{margin:0;flex:1 1 auto;font-size:clamp(1.5rem,2.8vw,2.1rem);color:var(--cd);line-height:1.2}
.gtitle small{display:block;font-size:.55em;color:var(--muted)}
.turn{font-weight:800;font-size:1.2rem;padding:6px 16px;border-radius:999px}
.turn.t0{background:var(--pink-s);color:var(--pink-d)} .turn.t1{background:var(--teal-s);color:var(--teal-d)}
.qnum{font-weight:800;font-size:1.3rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pdots{display:flex;gap:8px}
.pdots i{flex:1;height:14px;border-radius:8px;background:var(--line);transition:background .3s}
.pdots i.cur{background:var(--c)} .pdots i.ok{background:var(--green)} .pdots i.no{background:var(--orange)}
.body{display:flex;flex-direction:column;gap:22px}
.q{font-size:clamp(1.6rem,3.2vw,2.6rem);font-weight:800;line-height:1.5;margin:0;text-wrap:balance}
.say{font-family:var(--txt);color:var(--pink-d)}
.hint{color:var(--muted);font-size:1.25rem;margin:0;text-align:center}
.hint b{color:var(--teal);font-size:1.5rem}
.dot{color:var(--pink);font-weight:800}

.passage{font-family:var(--txt);font-size:clamp(1.35rem,2.5vw,2.1rem);line-height:2.15;background:var(--bg);border-radius:24px;padding:14px 24px;margin:0}
.ptag{display:inline-block;font-family:var(--ui);font-size:clamp(.95rem,1.4vw,1.15rem);font-weight:800;color:#fff;background:var(--teal);border-radius:12px;padding:0 12px;margin-inline-end:10px;vertical-align:middle;line-height:1.9}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.opt{background:var(--card);border:3px solid var(--line-d);border-radius:24px;padding:12px 18px;font-family:var(--txt);font-weight:700;font-size:clamp(1.4rem,2.6vw,2.2rem);min-height:92px;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--c);background:var(--cs)}
.opt.big{font-size:clamp(2.6rem,6vw,4.4rem);line-height:1.3}
.opt.ok{background:var(--green);border-color:var(--green);color:#fff;--sh:var(--green-d)}
.opt.no{background:var(--red-s);border-color:var(--red);color:var(--red-d);--sh:var(--red)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.45}

.statement{font-family:var(--txt);font-weight:700;font-size:clamp(1.7rem,3.6vw,3rem);line-height:1.9;text-align:center;background:var(--bg);border-radius:24px;padding:20px 24px;margin:0;text-wrap:balance}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tfb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:30px;min-height:150px;padding:12px;color:#fff;font-weight:800;font-size:clamp(1.8rem,4vw,3rem);line-height:1.2}
.tfb .mk{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:2.4rem}
.tfb small{font-size:.5em;font-weight:700;opacity:.92}
.tfb.yes{background:var(--pink);--sh:var(--pink-d)} .tfb.nope{background:var(--orange);--sh:var(--orange-d)}
.tfb.g{background:var(--green);--sh:var(--green-d)}
.tfb:disabled{opacity:.3;cursor:default}
.tfb.picked{opacity:1;outline:6px solid var(--ink);outline-offset:3px}

/* detective */
.para{font-family:var(--txt);font-size:clamp(1.45rem,2.7vw,2.3rem);line-height:1.9;background:var(--bg);border-radius:24px;padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.tk{font-family:inherit;font-weight:700;border-radius:14px;padding:0 8px;line-height:1.75;border:3px solid transparent}
.tk:hover:not(:disabled){background:var(--teal-s)}
.tk:disabled{cursor:default}
.tk.dt{min-width:46px;font-size:1.35em;line-height:1.2;padding:0 10px}
.tk.ok{background:var(--green-s);border-color:var(--green)}
.tk.dt.ok{color:var(--pink-d)}
.tk.no{background:var(--red-s);border-color:var(--red)}

/* count */
.sentence{display:flex;flex-wrap:wrap;gap:16px 12px;justify-content:center;align-items:center;font-family:var(--txt);font-size:clamp(1.7rem,3.6vw,3rem);background:var(--bg);border-radius:24px;padding:24px 18px 18px}
.w{position:relative;background:var(--card);border:3px solid var(--line-d);border-radius:18px;padding:2px 16px;font-family:inherit;font-weight:700;line-height:1.7}
.w.on{background:var(--violet-s);border-color:var(--violet)}
.w.ok{background:var(--green-s);border-color:var(--green)}
.w .n{position:absolute;top:-18px;inset-inline-start:-10px;background:var(--violet);color:#fff;font-family:var(--ui);font-size:1.15rem;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;line-height:1}
.w.ok .n{background:var(--green)}
.fin{font-weight:800;color:var(--pink);font-size:1.3em}
.crow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.reset{background:var(--bg);border-radius:999px;padding:4px 18px;font-weight:700;font-size:1.1rem;color:var(--muted);--sh:var(--line)}
.nums{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.num{width:clamp(70px,9vw,100px);height:clamp(70px,9vw,100px);border-radius:50%;background:var(--card);border:3px solid var(--line-d);font-size:clamp(2rem,4vw,2.8rem);font-weight:800}
.num:hover:not(:disabled){border-color:var(--c);background:var(--cs)}
.num:disabled{cursor:default}
.num.ok{background:var(--green);border-color:var(--green);color:#fff;--sh:var(--green-d)}
.num.no{background:var(--red);border-color:var(--red);color:#fff;--sh:var(--red-d)}

/* order + fill */
.slots{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;min-height:104px;background:var(--bg);border-radius:24px;padding:16px}
.slot{min-width:110px;min-height:76px;border:3px dashed var(--orange);border-radius:18px;display:grid;place-items:center}
.slot.f{border-color:transparent}
.bank{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:84px}
.tile{background:var(--orange-s);border:3px solid var(--orange);border-radius:18px;padding:4px 18px;font-family:var(--txt);font-weight:700;font-size:clamp(1.5rem,3vw,2.5rem);line-height:1.6;--sh:var(--orange-d)}
.slot .tile{background:var(--card);border-color:var(--teal);--sh:var(--teal-d)}
.tile.ok{background:var(--green-s)!important;border-color:var(--green)!important}
.tile.no{background:var(--red-s)!important;border-color:var(--red)!important}
.rule{font-family:var(--txt);font-weight:700;font-size:clamp(1.6rem,3.2vw,2.7rem);line-height:2.3;background:var(--bg);border-radius:24px;padding:16px 24px;margin:0;text-align:center;text-wrap:balance}
.blank{display:inline-block;min-width:4.5em;min-height:1.4em;border-bottom:5px dashed var(--line-d);margin-inline:6px;padding:0 10px;line-height:1.5;vertical-align:baseline;color:var(--green-d)}
.blank.now{border-color:var(--pink);background:var(--pink-s);border-radius:12px 12px 0 0}
.blank.filled{border-bottom-style:solid;border-color:var(--green)}
.chipw{background:var(--pink-s);border:3px solid var(--pink);border-radius:20px;padding:4px 22px;font-family:var(--txt);font-weight:700;font-size:clamp(1.5rem,3vw,2.4rem);line-height:1.6;--sh:var(--pink-d)}

/* what is this */
.thing{font-family:var(--txt);font-weight:700;background:var(--bg);border-radius:24px;padding:18px 24px;min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;margin:0}
.thing.l{font-size:clamp(6rem,14vw,10rem);line-height:1.1}
.thing.w{font-size:clamp(3rem,7vw,5rem);line-height:1.6}
.thing.s{font-size:clamp(2rem,4.2vw,3.2rem);line-height:1.8;text-wrap:balance}
.thing.p{font-size:clamp(1.3rem,2.4vw,2rem);line-height:2.1;text-align:start;justify-content:flex-start}
.kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kind{border-radius:24px;color:#fff;font-weight:800;font-size:clamp(1.5rem,3vw,2.3rem);min-height:100px;background:var(--k);--sh:var(--kd)}
.kind:disabled{opacity:.3;cursor:default}
.kind.ok{opacity:1;outline:6px solid var(--green);outline-offset:3px}
.kind.no{opacity:1;outline:6px solid var(--red);outline-offset:3px}

/* build + letter */
.bwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1.1}
.bwrap .emo{font-size:clamp(4.5rem,10vw,7.5rem)}
.bword{font-family:var(--txt);font-weight:700;font-size:clamp(3rem,7vw,5.5rem);line-height:1.4;color:var(--orange-d);min-height:1.4em}
.bword .ph{color:var(--line-d)}
.lslots{display:flex;gap:12px}
.ls{width:clamp(70px,9vw,96px);height:clamp(70px,9vw,96px);border:3px dashed var(--orange);border-radius:20px;display:grid;place-items:center;font-family:var(--txt);font-weight:700;font-size:clamp(2.2rem,4.5vw,3.4rem)}
.ls.f{border-style:solid;background:var(--orange-s)}
.lbank{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.lt{width:clamp(78px,10vw,106px);height:clamp(78px,10vw,106px);border-radius:22px;background:var(--card);border:3px solid var(--line-d);font-family:var(--txt);font-weight:700;font-size:clamp(2.4rem,5vw,3.6rem)}
.lt:hover:not(:disabled){border-color:var(--c);background:var(--cs)}
.lt:disabled{opacity:.25;cursor:default}
.pic{display:flex;flex-direction:column;align-items:center;gap:2px}
.pic .emo{font-size:clamp(5rem,12vw,8.5rem)}
.pic .word{font-family:var(--txt);font-weight:700;font-size:clamp(2.2rem,5vw,3.6rem)}

/* match */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(56px,13vw,200px);row-gap:14px}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.col{display:flex;flex-direction:column;gap:14px}
.mi{position:relative;z-index:1;background:var(--card);border:3px solid var(--line-d);border-radius:22px;min-height:84px;padding:6px 16px;font-family:var(--txt);font-weight:700;font-size:clamp(1.4rem,2.8vw,2.3rem);display:flex;align-items:center;justify-content:center;gap:12px;line-height:1.5}
.mi .emo{font-size:1.3em}
.mi.big{font-size:clamp(2.2rem,4.6vw,3.6rem)}
.mi.long{font-size:clamp(1.15rem,2.1vw,1.7rem)}
.mi:hover:not(.done){border-color:var(--c)}
.mi.sel{border-color:var(--c);background:var(--cs);transform:scale(1.04)}
.mi.done{cursor:default;color:#fff}

/* feedback */
.fb{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;border-radius:28px;padding:12px 22px}
.fb.good{background:var(--green-s)} .fb.bad{background:var(--orange-s)} .fb.mid{background:var(--sun-s)}
.fb .mascot{width:104px}
.fb .msg{flex:1 1 300px;min-width:0}
.fb strong{display:block;font-size:clamp(1.8rem,3.4vw,2.5rem);line-height:1.3}
.fb.good strong{color:var(--green-d)} .fb.bad strong{color:var(--orange-d)} .fb.mid strong{color:var(--sun-d)}
.fb .ans{font-family:var(--txt);font-weight:700;font-size:clamp(1.3rem,2.4vw,1.8rem);line-height:1.8}
.fb p{margin:0;font-family:var(--txt);font-size:clamp(1.15rem,2vw,1.5rem);line-height:1.9}
.streak{display:inline-block;margin-top:6px;background:var(--sun);color:var(--ink);font-weight:800;font-size:1.15rem;border-radius:999px;padding:2px 14px}
.next{background:var(--teal);color:#fff;font-weight:800;font-size:clamp(1.5rem,2.8vw,2.1rem);border-radius:24px;padding:10px 36px;min-height:78px;--sh:var(--teal-d)}

var ac;
function tone(freqs, type, dur) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach(function (f, i) {
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * dur * 0.8;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
    });
  } catch (e) {}
}
function sGood() { tone([523, 659, 784], "triangle", 0.16); }
function sBad() { tone([260, 200], "sine", 0.22); }
function sWin() { tone([523, 659, 784, 1047, 784, 1047], "triangle", 0.17); }
var fx = document.getElementById("fx"), cx = fx.getContext("2d"), bits = [], raf = 0;
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n) {
  if (reduce) return;
  fx.width = innerWidth; fx.height = innerHeight;
  var cols = ["#d9508a", "#178a9c", "#ef8a2b", "#25a064", "#f3b51b", "#7a5bd5"];
  for (var i = 0; i < n; i++) bits.push({ x: innerWidth / 2 + (Math.random() - 0.5) * 240, y: innerHeight * 0.5, vx: (Math.random() - 0.5) * 17, vy: -Math.random() * 17 - 4, r: Math.random() * 6 + 6, c: cols[i % cols.length], a: Math.random() * 6, life: 0 });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, fx.width, fx.height);
  bits = bits.filter(function (b) { return b.life < 150 && b.y < fx.height + 20; });
  bits.forEach(function (b) { b.life++; b.vy += 0.45; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.a += 0.2; cx.save(); cx.translate(b.x, b.y); cx.rotate(b.a); cx.fillStyle = b.c; cx.fillRect(-b.r / 2, -b.r / 4, b.r, b.r / 2); cx.restore(); });
  raf = bits.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0, 0, fx.width, fx.height);
}
function shake(el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

  body.innerHTML = '<p class="q">' + prompt + '</p><div class="para"><span class="ptag">' + PNAME[q.p] + "</span>" +
    sents.map(function (ws, s) {
      return ws.map(function (w, i) { return '<button class="tk" type="button" data-s="' + s + '" data-w="' + i + '">' + w + "</button>"; }).join("") +
        '<button class="tk dt" type="button" data-s="' + s + '" data-w="-1" aria-label="نقطة">.</button>';
    }).join("") + "</div>" +
    (q.task === "dots" ? '<p class="hint">وَجَدْتُمْ: <b class="counter">' + ar(0) + "</b></p>" : "");
  var tks = [].slice.call(body.querySelectorAll(".tk"));
  if (q.task === "dots") {
    var found = 0, m = 0, cnt = body.querySelector(".counter");
    tks.forEach(function (t) {
      t.onclick = function () {
        if (t.classList.contains("ok")) return;
        if (t.dataset.w === "-1") {
          t.classList.add("ok", "pop"); found++; cnt.textContent = ar(found); api.tick(500 + found * 90);
          if (found === sents.length) {
            tks.forEach(function (x) { x.disabled = true; });
            api.done(m ? "partial" : "right", { m: m, why: "وَجَدْتُمْ " + ar(found) + " نِقاطٍ، إِذًا في الْفِقْرَةِ " + NSENT[found] + "." });
          }
        } else { m++; api.oops(t); }
      };
    });
    return;
  }
  var ts, tw = null;
  if (q.task === "first") { ts = 0; tw = 0; }
  if (q.task === "last") { ts = sents.length - 1; tw = sents[ts].length - 1; }
  if (q.task === "sfirst") { ts = sn; tw = 0; }
  if (q.task === "slast") { ts = sn; tw = sents[sn].length - 1; }
  if (q.task === "sent") { ts = sn; }
  function hit(t) { return +t.dataset.s === ts && (tw === null || +t.dataset.w === tw); }
  var word = tw === null ? null : sents[ts][tw];
  var why = {
    first: "تَبْدَأُ " + PNAME[q.p] + " بِكَلِمَةِ «" + word + "».",
    last: "آخِرُ كَلِمَةٍ قَبْلَ النُّقْطَةِ الْأَخيرَةِ هِيَ «" + word + "».",
    sent: "كُلُّ جُمْلَةٍ تَنْتَهي بِنُقْطَةٍ. الْجُمْلَةُ " + ORDN[sn] + " هِيَ: «" + sents[ts].join(" ") + ".»",
    sfirst: "الْجُمْلَةُ " + ORDN[sn] + " تَبْدَأُ بَعْدَ النُّقْطَةِ بِكَلِمَةِ «" + word + "».",
    slast: "الْجُمْلَةُ " + ORDN[sn] + " تَنْتَهي بِكَلِمَةِ «" + word + "» ثُمَّ تَأْتي النُّقْطَةُ."
  }[q.task];
  tks.forEach(function (t) {
    t.onclick = function () {
      var ok = hit(t);
      tks.forEach(function (x) { x.disabled = true; if (hit(x)) x.classList.add("ok"); });
      if (!ok) { t.classList.add("no"); shake(t); }
      api.done(ok ? "right" : "wrong", { ans: word ? "«" + word + "»" : "الْجُمْلَةُ " + ORDN[sn], why: why });
    };
  });
};

R.count = function (q, body, api) {
  var words = q.s.split(" "), n = words.length, c = 0;
  var nums = []; for (var i = 2; i <= 8; i++) nums.push(i);
  body.innerHTML = '<p class="q">كَمْ كَلِمَةً في هٰذِهِ الْجُمْلَةِ؟</p><div class="sentence">' +
    words.map(function (w) { return '<button class="w" type="button">' + w + "</button>"; }).join("") + '<span class="fin">.</span></div>' +
    '<div class="crow"><p class="hint">اُنْقُروا عَلى كُلِّ كَلِمَةٍ لِنَعُدَّها مَعًا: <b class="counter">' + ar(0) + '</b></p><button class="reset press" type="button">↺ نَعُدُّ مِنْ جَديدٍ</button></div>' +
    '<div class="nums">' + nums.map(function (k) { return '<button class="num press" type="button" data-n="' + k + '">' + ar(k) + "</button>"; }).join("") + "</div>";
  var counter = body.querySelector(".counter"), ws = [].slice.call(body.querySelectorAll(".w")), locked = false;
  ws.forEach(function (w) {
    w.onclick = function () {
      if (locked || w.classList.contains("on")) return;
      c++; w.classList.add("on"); w.insertAdjacentHTML("beforeend", '<span class="n">' + ar(c) + "</span>"); counter.textContent = ar(c); api.tick(440 + c * 60);
    };
  });
  body.querySelector(".reset").onclick = function () {
    if (locked) return;
    c = 0; counter.textContent = ar(0);
    ws.forEach(function (w) { w.classList.remove("on"); var b = w.querySelector(".n"); if (b) b.remove(); });
  };
  var nb = [].slice.call(body.querySelectorAll(".num"));
  nb.forEach(function (b) {
    b.onclick = function () {
      locked = true;
      var ok = +b.dataset.n === n;
      nb.forEach(function (x) { x.disabled = true; if (+x.dataset.n === n) x.classList.add("ok"); });
      ws.forEach(function (w, i) { w.classList.remove("on"); w.classList.add("ok"); var t = w.querySelector(".n"); if (t) t.textContent = ar(i + 1); else w.insertAdjacentHTML("beforeend", '<span class="n">' + ar(i + 1) + "</span>"); });
      if (!ok) { b.classList.add("no"); shake(b); }
      api.done(ok ? "right" : "wrong", { ans: ar(n), why: words.map(function (w, i) { return w + " (" + ar(i + 1) + ")"; }).join(" ") });
    };
  });
};

R.order = function (q, body, api) {
  var words = q.s.split(" "), accepted = [q.s].concat(q.alt || []).map(function (s) { return s.split(" "); });
  var bank = shuffle(words.map(function (w, i) { return i; }));
  if (bank.every(function (v, i) { return v === i; })) bank.reverse();
  var slots = words.map(function () { return null; }), m = 0, locked = false;
  body.innerHTML = '<p class="q">رَتِّبوا الْكَلِماتِ لِتَصيرَ جُمْلَةً تُفيدُ مَعْنًى تامًّا.</p><div class="slots"></div><div class="bank"></div><p class="hint">اُنْقُروا عَلى كَلِمَةٍ في الصُّنْدوقِ لِإِرْجاعِها.</p>';
  var slotsEl = body.querySelector(".slots"), bankEl = body.querySelector(".bank");
  function paint() {
    slotsEl.innerHTML = slots.map(function (w, k) { return '<div class="slot' + (w === null ? "" : " f") + '">' + (w === null ? "" : '<button class="tile press" type="button" data-s="' + k + '">' + words[w] + "</button>") + "</div>"; }).join("") + '<span class="fin" style="font-family:var(--txt);font-size:2.6rem">.</span>';
    bankEl.innerHTML = bank.map(function (i) { return '<button class="tile press" type="button" data-b="' + i + '">' + words[i] + "</button>"; }).join("");
    [].forEach.call(slotsEl.querySelectorAll("[data-s]"), function (t) { t.onclick = function () { if (locked) return; var k = +t.dataset.s; bank.push(slots[k]); slots[k] = null; paint(); }; });
    [].forEach.call(bankEl.querySelectorAll("[data-b]"), function (t) {
      t.onclick = function () {
        if (locked) return;
        var i = +t.dataset.b, k = slots.indexOf(null); slots[k] = i; bank = bank.filter(function (x) { return x !== i; }); paint(); api.tick(520);
        if (slots.indexOf(null) === -1) check();
      };
    });
  }
  function check() {
    var cur = slots.map(function (i) { return words[i]; });
    var best = accepted[0], bestScore = -1;
    accepted.forEach(function (a) { var sc = a.filter(function (w, k) { return cur[k] === w; }).length; if (sc > bestScore) { bestScore = sc; best = a; } });
    var tiles = [].slice.call(slotsEl.querySelectorAll(".tile"));
    tiles.forEach(function (t, k) { t.classList.add(cur[k] === best[k] ? "ok" : "no"); });
    locked = true;
    if (bestScore === words.length) { api.done(m ? "partial" : "right", { m: m, why: "«" + cur.join(" ") + ".» جُمْلَةٌ تُفيدُ مَعْنًى تامًّا." }); return; }
    m++; sBad();
    setTimeout(function () {
      slots.forEach(function (w, k) { if (words[w] !== best[k]) { bank.push(w); slots[k] = null; } });
      locked = false; paint();
    }, 1100);
  }
  paint();
};

R.fill = function (q, body, api) {
  var parts = q.s.split("_"), k = 0, m = 0;
  body.innerHTML = '<p class="q">أَكْمِلوا الْقاعِدَةَ: اُنْقُروا عَلى الْكَلِمَةِ الْمُناسِبَةِ لِكُلِّ فَراغٍ.</p><p class="rule">' +
    parts.map(function (p, i) { return dots(p) + (i < parts.length - 1 ? '<span class="blank"></span>' : ""); }).join("") +
    '</p><div class="bank">' + shuffle(q.a.concat(q.x)).map(function (c) { return '<button class="chipw press" type="button">' + c + "</button>"; }).join("") + "</div>";
  var blanks = [].slice.call(body.querySelectorAll(".blank"));
  function mark() { blanks.forEach(function (b, i) { b.classList.toggle("now", i === k); }); }
  mark();
  [].forEach.call(body.querySelectorAll(".chipw"), function (c) {
    c.onclick = function () {
      if (k >= blanks.length) return;
      if (c.textContent === q.a[k]) {
        blanks[k].textContent = c.textContent; blanks[k].classList.add("filled", "pop"); c.remove(); k++; mark(); api.tick(560 + k * 90);
        if (k === blanks.length) {
          [].forEach.call(body.querySelectorAll(".chipw"), function (x) { x.disabled = true; });
          api.done(m ? "partial" : "right", { m: m, why: "«" + parts.map(function (p, i) { return p + (q.a[i] || ""); }).join("") + "»" });
        }
      } else { m++; api.oops(c); }
    };
  });
};

R.what = function (q, body, api) {
  var kind = KINDS.filter(function (x) { return x.id === q.a; })[0];
  body.innerHTML = '<p class="q">ما هٰذا؟ حَرْفٌ أَمْ كَلِمَةٌ أَمْ جُمْلَةٌ أَمْ فِقْرَةٌ؟</p><p class="thing ' + q.a + '">' + dots(q.s) + '</p><div class="kinds">' +
    KINDS.map(function (x) { return '<button class="kind press" type="button" data-k="' + x.id + '" style="--k:var(--' + x.c + ");--kd:var(--" + x.c + '-d)">' + x.n + "</button>"; }).join("") + "</div>";
  var btns = [].slice.call(body.querySelectorAll(".kind"));
  btns.forEach(function (b) {
    b.onclick = function () {
      var ok = b.dataset.k === q.a;
      btns.forEach(function (x) { x.disabled = true; if (x.dataset.k === q.a) x.classList.add("ok"); });
      if (!ok) { b.classList.add("no"); shake(b); }
      var why = kind.why;
      if (q.a === "p") { var n = (q.s.match(/\./g) || []).length; why = "هٰذِهِ فِقْرَةٌ: فيها " + NSENT[n] + "، وَكُلُّ جُمْلَةٍ تَنْتَهي بِنُقْطَةٍ."; }
      api.done(ok ? "right" : "wrong", { ans: kind.n, why: why });
    };
  });
};

R.build = function (q, body, api) {
  var L = q.L, k = 0, m = 0;
  var grp = LOOKALIKE.filter(function (g) { return g.some(function (x) { return L.indexOf(x) > -1; }); })[0] || [];
  var extra = shuffle(grp.filter(function (x) { return L.indexOf(x) === -1; })).slice(0, 1);
  var rest = shuffle(ABC.map(function (a) { return a[0]; }).filter(function (x) { return L.indexOf(x) === -1 && extra.indexOf(x) === -1; }));
  while (extra.length < 2) extra.push(rest.pop());
  body.innerHTML = '<p class="q">رَكِّبوا الْكَلِمَةَ: اُنْقُروا عَلى الْأَحْرُفِ بِالتَّرْتيبِ.</p><div class="bwrap"><span class="emo" aria-hidden="true">' + q.e + '</span><div class="bword"><span class="ph">؟</span></div><div class="lslots">' +
    L.map(function () { return '<span class="ls"></span>'; }).join("") + '</div></div><div class="lbank">' +
    shuffle(L.concat(extra)).map(function (t) { return '<button class="lt press" type="button">' + t + "</button>"; }).join("") + "</div>";
  var ls = [].slice.call(body.querySelectorAll(".ls")), bw = body.querySelector(".bword");
  [].forEach.call(body.querySelectorAll(".lt"), function (b) {
    b.onclick = function () {
      if (k >= L.length) return;
      if (b.textContent === L[k]) {
        ls[k].textContent = L[k]; ls[k].classList.add("f", "pop"); b.disabled = true; k++;
        bw.textContent = L.slice(0, k).join(""); api.tick(520 + k * 90);
        if (k === L.length) {
          [].forEach.call(body.querySelectorAll(".lt"), function (x) { x.disabled = true; });
          bw.classList.add("pop");
          api.done(m ? "partial" : "right", { m: m, why: q.w + " = " + L.join(" + ") + ". تَتَأَلَّفُ كَلِمَةُ «" + q.w + "» مِنْ " + NLET[L.length] + "." });
        }
      } else { m++; api.oops(b); }
    };
  });
};

R.letter = function (q, body, api) {
  var grp = LOOKALIKE.filter(function (g) { return g.indexOf(q.L) > -1; })[0] || [];
  var others = shuffle(grp.filter(function (x) { return x !== q.L; })).concat(shuffle(ABC.map(function (a) { return a[0]; }).filter(function (x) { return x !== q.L && grp.indexOf(x) === -1; })));
  var opts = shuffle([q.L, others[0], others[1]]);
  body.innerHTML = '<p class="q">بِأَيِّ حَرْفٍ تَبْدَأُ هٰذِهِ الْكَلِمَةُ؟</p><div class="pic"><span class="emo" aria-hidden="true">' + q.e + '</span><span class="word">' + q.w + '</span></div><div class="opts">' +
    opts.map(function (o) { return '<button class="opt big press" type="button" data-l="' + o + '">' + o + "</button>"; }).join("") + "</div>";
  var btns = [].slice.call(body.querySelectorAll(".opt"));
  btns.forEach(function (b) {
    b.onclick = function () {
      var ok = b.dataset.l === q.L;
      btns.forEach(function (x) { x.disabled = true; if (x.dataset.l === q.L) x.classList.add("ok"); });
      if (!ok) { b.classList.add("no"); shake(b); }
      api.done(ok ? "right" : "wrong", { ans: q.L, why: "كَلِمَةُ «" + q.w + "» تَبْدَأُ بِحَرْفِ " + q.L + "." });
    };
  });
};

var PAIRCOLS = ["#d9508a", "#178a9c", "#ef8a2b", "#25a064"];
R.match = function (q, body, api) {
  var idx = q.pairs.map(function (p, i) { return i; }), A = shuffle(idx), B = shuffle(idx);
  var cls = q.big ? " big" : q.long ? " long" : "";
  body.innerHTML = '<p class="q">' + q.hint + '</p><div class="match"><svg aria-hidden="true"></svg><div class="col a">' +
    A.map(function (i) { return '<button class="mi press' + cls + '" type="button" data-i="' + i + '">' + q.pairs[i][0] + "</button>"; }).join("") + '</div><div class="col b">' +
    B.map(function (i) { return '<button class="mi press' + (q.long ? " long" : "") + '" type="button" data-i="' + i + '">' + q.pairs[i][1] + "</button>"; }).join("") + "</div></div>";
  var box = body.querySelector(".match"), lines = box.querySelector("svg"), sel = null, done = 0, m = 0, links = [];
  function draw() {
    var br = box.getBoundingClientRect();
    lines.innerHTML = links.map(function (l) {
      var ra = l[0].getBoundingClientRect(), rb = l[1].getBoundingClientRect();
      var x1 = ra.left - br.left, y1 = ra.top + ra.height / 2 - br.top, x2 = rb.right - br.left, y2 = rb.top + rb.height / 2 - br.top;
      return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + l[2] + '" stroke-width="7" stroke-linecap="round"/><circle cx="' + x1 + '" cy="' + y1 + '" r="10" fill="' + l[2] + '"/><circle cx="' + x2 + '" cy="' + y2 + '" r="10" fill="' + l[2] + '"/>';
    }).join("");
  }
  if (window.ResizeObserver) new ResizeObserver(draw).observe(box); else addEventListener("resize", draw);
  [].forEach.call(body.querySelectorAll(".mi"), function (b) {
    b.onclick = function () {
      if (b.classList.contains("done")) return;
      if (!sel || sel.parentElement === b.parentElement) { if (sel) sel.classList.remove("sel"); sel = b; b.classList.add("sel"); api.tick(700); return; }
      var a = sel.parentElement.classList.contains("a") ? sel : b, c = a === sel ? b : sel;
      sel.classList.remove("sel"); sel = null;
      if (a.dataset.i === c.dataset.i) {
        var col = PAIRCOLS[done % PAIRCOLS.length];
        [a, c].forEach(function (x) { x.classList.add("done", "pop"); x.style.background = col; x.style.borderColor = col; x.style.setProperty("--sh", "rgba(0,0,0,.18)"); });
        links.push([a, c, col]); draw(); done++;
        if (done === q.pairs.length) api.done(m ? "partial" : "right", { m: m, why: m ? "" : "وَصَلْتُمْ كُلَّ شَيْءٍ مِنَ الْمَرَّةِ الْأولى." });
        else api.tick(660);
      } else { m++; sBad(); shake(a); shake(c); }
    };
  });
};

/* ================= tools ================= */
document.getElementById("homeBtn").onclick = home;
var soundBtn = document.getElementById("soundBtn");
function drawSound() { soundBtn.innerHTML = S.sound ? IC.soundOn : IC.soundOff; soundBtn.setAttribute("aria-label", S.sound ? "إيقاف الصوت" : "تشغيل الصوت"); }
soundBtn.onclick = function () { S.sound = !S.sound; drawSound(); };
drawSound();
document.getElementById("fsBtn").onclick = function () {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else { var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
  } catch (e) {}
};
addEventListener("resize", function () { if (raf) { fx.width = innerWidth; fx.height = innerHeight; } });

home();
})();
</script>
